name: Release GeoTIFF

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Istniejący tag do wygenerowania release (np. v0.6.2)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Sprawdź istniejący tag i checkout
        run: |
          case "$RELEASE_TAG" in v[0-9]*) ;; *) exit 1 ;; esac
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Wygeneruj pełny katalog w przypiętym środowisku
        run: ./scripts/build generate --all
      - name: Wspólna bramka manifestu, aktualności, pełnego QA i ZIP
        env:
          RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'tag' }}
        run: |
          ./scripts/build package --mode "$RELEASE_MODE" \
            --run-dir /build/geotiff/current --reports-dir /build/release-qa \
            --archive "/build/geotiff-tatry-${RELEASE_TAG}.zip"
      - name: Udostępnij raport odbioru
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-qa-${{ github.run_id }}
          path: build/release-qa
          if-no-files-found: error
      - name: Opublikuj wyłącznie paczkę po wspólnej bramce
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: build/geotiff-tatry-${{ env.RELEASE_TAG }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
