name: Release GeoTIFF

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do wygenerowania release (np. v0.5.2)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install GDAL
        run: sudo apt-get update && sudo apt-get install -y gdal-bin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Generate all GeoTIFFs
        run: python pipeline/02_generate_geotiff.py --all

      - name: Create archive
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          mkdir -p _release
          for georef in data/caves/*/image_georef.tif; do
            dir_id=$(basename "$(dirname "$georef")")
            yaml="$(dirname "$georef")/meta.yaml"
            inv=$(python3 -c "import yaml; m=yaml.safe_load(open('$yaml')); print(m['cave']['inventory_number'])")
            name=$(python3 -c "import yaml; m=yaml.safe_load(open('$yaml')); print(m['cave']['name'])")
            # Sanitize: spacje→_, usunięcie znaków problematycznych
            safe_inv=$(echo "$inv" | tr ' /' '__' | tr -d "'\"")
            safe_name=$(echo "$name" | tr ' /' '__' | tr -d "'\"")
            cp "$georef" "_release/${dir_id}_${safe_inv}_${safe_name}.tif"
          done
          tar czf "geotiff-tatry-${TAG}.tar.gz" -C _release .
          echo "ARCHIVE=geotiff-tatry-${TAG}.tar.gz" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
