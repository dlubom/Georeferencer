name: Generate GeoTIFF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geotiff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/geotiff
          key: geotiff-${{ runner.os }}-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            geotiff-${{ runner.os }}-${{ github.ref }}-
            geotiff-${{ runner.os }}-refs/heads/main-
      - name: Pełny katalog według treści i całego zakresu zdarzenia
        run: ./scripts/build generate --changed
      - name: Rozwiąż current dla QA i artefaktu
        id: run
        run: echo "directory=build/geotiff/$(readlink build/geotiff/current)" >> "$GITHUB_OUTPUT"
      - name: Pełne QA źródeł i tego samego przebiegu
        env:
          RUN_DIRECTORY: ${{ steps.run.outputs.directory }}
        run: ./scripts/build report --run-dir "/build/${RUN_DIRECTORY#build/}" --require-results --reports-dir /build/qa
      - name: Udostępnij kompletny przebieg i manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geotiff-run-${{ github.run_id }}
          path: ${{ steps.run.outputs.directory }}
          if-no-files-found: error
          retention-days: 14
      - name: Udostępnij raporty i zakres zmian
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: geotiff-qa-${{ github.run_id }}
          path: |
            build/qa
            build/selection.json
          if-no-files-found: error
          retention-days: 14
